name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose artifacts should be rebuilt
        required: true
        type: string

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish driver JAR
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release-created == 'true' || inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag-name }}
    steps:
      - name: Validate release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Check out Metabase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metabase/metabase
          ref: 0c64e27763e13123766434979ed3e41f0cd185bc # v0.61.2
          path: target/metabase
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.5.1654

      - name: Cache Clojure dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
            target/metabase/.cpcache
          key: ${{ runner.os }}-release-clojure-${{ hashFiles('deps.edn') }}-metabase-0.61.2
          restore-keys: |
            ${{ runner.os }}-release-clojure-

      - name: Build driver JAR
        run: METABASE_DIR="$GITHUB_WORKSPACE/target/metabase" ./bin/build-driver.sh

      - name: Verify release artifact
        run: |
          artifact=target/altertable.metabase-driver.jar
          version="${RELEASE_TAG#v}"
          test -f "$artifact"
          jar tf "$artifact" | grep --fixed-strings metabase-plugin.yaml
          unzip -p "$artifact" metabase-plugin.yaml |
            grep --extended-regexp "^  version: [\"']?${version}[\"']?$"
          (
            cd target
            mv altertable.metabase-driver.jar "altertable.metabase-driver-${version}.jar"
            sha256sum "altertable.metabase-driver-${version}.jar" \
              >"altertable.metabase-driver-${version}.jar.sha256"
          )

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "target/altertable.metabase-driver-${version}.jar" \
            "target/altertable.metabase-driver-${version}.jar.sha256" \
            --clobber
