info:
  name: Metabase Altertable Driver
  version: 0.1.0
  description: Allows Metabase to query an Altertable Lakehouse catalog.
driver:
  name: altertable
  display-name: Altertable
  lazy-load: true
  parent: sql
  connection-properties:
    - name: base-url
      display-name: API URL
      default: https://api.altertable.ai
      required: true
    - name: catalog
      display-name: Catalog
      required: true
    - name: schema
      display-name: Default schema
      required: false
    - name: username
      display-name: Username
      required: false
    - name: password
      display-name: Password
      type: password
      required: false
    - name: basic-token
      display-name: Basic token
      type: password
      required: false
    - advanced-options-start
    - name: compute-size
      display-name: Compute size (AUTO, XS, S, M, L, or XL)
      type: string
      default: AUTO
      visible-if:
        advanced-options: true
    - name: connect-timeout-seconds
      display-name: Connection timeout (seconds)
      type: string
      default: "5"
      visible-if:
        advanced-options: true
    - name: request-timeout-seconds
      display-name: Query timeout (seconds)
      type: string
      default: "60"
      visible-if:
        advanced-options: true
init:
  - step: load-namespace
    namespace: metabase.driver.altertable
